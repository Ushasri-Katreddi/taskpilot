
[project]
name = "taskpilot"
version = "0.1.0"
description = "AI Productivity Assistant using FastMCP and LangChain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.0,<5.0",
    "langchain-groq>=1.1.3",
    "langchain[mcp]>=1.4.0",
    "python-dotenv",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["servers*", "client*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
